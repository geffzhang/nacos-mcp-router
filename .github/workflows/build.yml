name: Build .NET

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/NacosMcpRouter.sln

      - name: Build
        run: dotnet build src/NacosMcpRouter.sln --configuration Release --no-restore

      - name: Download embedding model
        run: bash src/scripts/download-model.sh

      - name: Test
        env:
          EMBEDDING_MODEL_DIR: models/all-MiniLM-L6-v2
        run: dotnet test src/NacosMcpRouter.sln --configuration Release --no-restore --no-build
